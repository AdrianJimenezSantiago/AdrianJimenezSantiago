l="#5d6878">[</tspan><tspan fill="#2f8a5f">full-stack web</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">clean architecture</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">local-first apps</tspan><tspan fill="#5d6878">]</tspan></text><text class="t ln" x="32" y="292" style="animation-delay:2.59s"><tspan fill="#3456c8">backend</tspan><tspan fill="#5d6878">: </tspan><tspan fill="#5d6878">[</tspan><tspan fill="#2f8a5f">Java</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Spring Boot</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Python</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">FastAPI</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">C#</tspan><tspan fill="#5d6878">]</tspan></text><text class="t ln" x="32" y="319" style="animation-delay:2.71s"><tspan fill="#3456c8">frontend</tspan><tspan fill="#5d6878">: </tspan><tspan fill="#5d6878">[</tspan><tspan fill="#2f8a5f">TypeScript</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Angular</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">React</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Next.js</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Tailwind</tspan><tspan fill="#5d6878">]</tspan></text><text class="t ln" x="32" y="346" style="animation-delay:2.83s"><tspan fill="#3456c8">quality</tspan><tspan fill="#5d6878">: </tspan><tspan fill="#5d6878">[</tspan><tspan fill="#2f8a5f">CI/CD</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">typed code</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">automated tests</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Robot Framework</tspan><tspan fill="#5d6878">]</tspan></text><text class="t ln" x="32" y="373" style="animation-delay:2.95s"><tspan fill="#3456c8">learning_now</tspan><tspan fill="#5d6878">: </tspan><tspan fill="#5d6878">[</tspan><tspan fill="#2f8a5f">Angular signals</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">Spring Boot 3</tspan><tspan fill="#5d6878">, </tspan><tspan fill="#2f8a5f">cloud on AWS</tspan><tspan fill="#5d6878">]</tspan></text><text class="t ln" x="32" y="400" style="animation-delay:3.07s"><tspan fill="#3456c8">motto</tspan><tspan fill="#5d6878">: </tspan><tspan fill="#2f8a5f">"Code is the canvas. Logic is the brush."</tspan></text><g class="ln" style="animation-delay:3.19s"><text class="t" x="32" y="454"><tspan class="p">adrian@indra</tspan><tspan fill="#5d6878">:</tspan><tspan fill="#3456c8">~</tspan><tspan fill="#5d6878">$ </tspan></text><rect class="cur" x="182.6" y="439" width="9" height="19" fill="#9c7426"/></g>
