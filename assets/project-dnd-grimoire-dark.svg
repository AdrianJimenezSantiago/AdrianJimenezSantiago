<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="t"><title id="t">Grimorio: A D&amp;D 2024 character sheet and spellbook that does the maths.</title><style>
    .k{font:600 11px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.26em;fill:#d9b36c}
    .ti{font:400 30px 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;fill:#ece6d8}
    .tg{font:400 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#8d97a6}
    .pt{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#ece6d8}
    .ch{font:500 11.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#ece6d8}
    .ft{font:500 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:#8d97a6}
    .sweep{animation:sw 7s ease-in-out infinite}
    @keyframes sw{0%{transform:translateX(-260px)}60%,100%{transform:translateX(640px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.in,.ln{opacity:1!important;transform:none!important}.b,.bar{transform:none!important}.line{stroke-dashoffset:0!important}}</style>
    <defs>
      <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#d9b36c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#d9b36c" stop-opacity=".09"/><stop offset="1" stop-color="#d9b36c" stop-opacity="0"/></linearGradient>
      <clipPath id="cc"><rect width="600" height="330" rx="16"/></clipPath>
    </defs>
    <g clip-path="url(#cc)">
      <rect width="600" height="330" fill="#10161f"/>
      <rect class="sweep" x="0" y="0" width="220" height="330" fill="url(#sh)" transform="skewX(-12)"/>
      <rect width="600" height="3" fill="#d9b36c"/>
    </g>
    <rect x=".5" y=".5" width="599" height="329" rx="16" fill="none" stroke="#232c3a"/>
    <g transform="translate(544 58)">
      <circle r="30" fill="#141b26" stroke="#232c3a"/><g fill="none" stroke="#d9b36c" stroke-width="1.6" stroke-linejoin="round"><path d="M0 -12 C-6 -17 -14 -17 -19 -15 V14 C-14 12 -6 12 0 17 C6 12 14 12 19 14 V-15 C14 -17 6 -17 0 -12 Z"/><path d="M0 -12 V17"/><path d="M9 -6 l1.6 3.4 3.7 .5 -2.7 2.6 .7 3.7 -3.3 -1.8 -3.3 1.8 .7 -3.7 -2.7 -2.6 3.7 -.5z" fill="#d9b36c" stroke="none"/></g>
    </g>
    <text class="k" x="32" y="48">OFFLINE-FIRST MOBILE &amp; WEB APP</text>
    <text class="ti" x="31" y="88">Grimorio</text>
    <text class="tg" x="32" y="118">A D&amp;D 2024 character sheet and spellbook that does the maths.</text>
    <path d="M32 138 H568" stroke="#232c3a"/>
    <circle cx="40" cy="164" r="2.4" fill="#d9b36c"/><text class="pt" x="54" y="169">Full 2024 rules: every class and subclass, 1 to 20</text><circle cx="40" cy="191" r="2.4" fill="#d9b36c"/><text class="pt" x="54" y="196">Android APK with Capacitor + installable PWA on Vercel</text><circle cx="40" cy="218" r="2.4" fill="#d9b36c"/><text class="pt" x="54" y="223">Combat mode, dice roller, inventory and journal</text><circle cx="40" cy="245" r="2.4" fill="#d9b36c"/><text class="pt" x="54" y="250">Reads your own rulebook PDFs on-device with PDF.js</text>
    <rect x="32" y="278" width="93" height="24" rx="12" fill="#1b2330" stroke="#232c3a"/><text class="ch" x="78" y="294" text-anchor="middle">JavaScript</text><rect x="133.0" y="278" width="50" height="24" rx="12" fill="#1b2330" stroke="#232c3a"/><text class="ch" x="158" y="294" text-anchor="middle">Vite</text><rect x="191.4" y="278" width="86" height="24" rx="12" fill="#1b2330" stroke="#232c3a"/><text class="ch" x="234" y="294" text-anchor="middle">Capacitor</text><rect x="285.3" y="278" width="72" height="24" rx="12" fill="#1b2330" stroke="#232c3a"/><text class="ch" x="321" y="294" text-anchor="middle">Android</text><rect x="365.0" y="278" width="65" height="24" rx="12" fill="#1b2330" stroke="#232c3a"/><text class="ch" x="397" y="294" text-anchor="middle">PDF.js</text>
