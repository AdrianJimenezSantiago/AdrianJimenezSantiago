l="#8d97a6">[</tspan><tspan fill="#7fd1a8">full-stack web</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">clean architecture</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">local-first apps</tspan><tspan fill="#8d97a6">]</tspan></text><text class="t ln" x="32" y="292" style="animation-delay:2.59s"><tspan fill="#7aa2f7">backend</tspan><tspan fill="#8d97a6">: </tspan><tspan fill="#8d97a6">[</tspan><tspan fill="#7fd1a8">Java</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Spring Boot</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Python</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">FastAPI</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">C#</tspan><tspan fill="#8d97a6">]</tspan></text><text class="t ln" x="32" y="319" style="animation-delay:2.71s"><tspan fill="#7aa2f7">frontend</tspan><tspan fill="#8d97a6">: </tspan><tspan fill="#8d97a6">[</tspan><tspan fill="#7fd1a8">TypeScript</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Angular</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">React</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Next.js</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Tailwind</tspan><tspan fill="#8d97a6">]</tspan></text><text class="t ln" x="32" y="346" style="animation-delay:2.83s"><tspan fill="#7aa2f7">quality</tspan><tspan fill="#8d97a6">: </tspan><tspan fill="#8d97a6">[</tspan><tspan fill="#7fd1a8">CI/CD</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">typed code</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">automated tests</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Robot Framework</tspan><tspan fill="#8d97a6">]</tspan></text><text class="t ln" x="32" y="373" style="animation-delay:2.95s"><tspan fill="#7aa2f7">learning_now</tspan><tspan fill="#8d97a6">: </tspan><tspan fill="#8d97a6">[</tspan><tspan fill="#7fd1a8">Angular signals</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">Spring Boot 3</tspan><tspan fill="#8d97a6">, </tspan><tspan fill="#7fd1a8">cloud on AWS</tspan><tspan fill="#8d97a6">]</tspan></text><text class="t ln" x="32" y="400" style="animation-delay:3.07s"><tspan fill="#7aa2f7">motto</tspan><tspan fill="#8d97a6">: </tspan><tspan fill="#7fd1a8">"Code is the canvas. Logic is the brush."</tspan></text><g class="ln" style="animation-delay:3.19s"><text class="t" x="32" y="454"><tspan class="p">adrian@indra</tspan><tspan fill="#8d97a6">:</tspan><tspan fill="#7aa2f7">~</tspan><tspan fill="#8d97a6">$ </tspan></text><rect class="cur" x="182.6" y="439" width="9" height="19" fill="#d9b36c"/></g>
