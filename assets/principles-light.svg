<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="t"><title id="t">Engineering principles: local-first, automated quality, built for people</title><style>
    .n{font:400 34px 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;fill:#9c7426}
    .h{font:600 17px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#1b2230}
    .d{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;fill:#5d6878}
    .in{opacity:0;animation:in .9s ease forwards}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.in,.ln{opacity:1!important;transform:none!important}.b,.bar{transform:none!important}.line{stroke-dashoffset:0!important}}</style><g transform="translate(0.5 .5)"><g class="in" style="animation-delay:0.15s"><rect width="384" height="169" rx="14" fill="#fbf9f4" stroke="#e4dccb"/><text class="n" x="24" y="58">01</text><path d="M24 74 H64" stroke="#9c7426" stroke-width="1.5"/><text class="h" x="24" y="104">Local-first</text><text class="d" x="24" y="130">Your data stays on your device:</text><text class="d" x="24" y="150">no accounts, works offline.</text></g></g><g transform="translate(408.2 .5)"><g class="in" style="animation-delay:0.35s"><rect width="384" height="169" rx="14" fill="#fbf9f4" stroke="#e4dccb"/><text class="n" x="24" y="58">02</text><path d="M24 74 H64" stroke="#9c7426" stroke-width="1.5"/><text class="h" x="24" y="104">Automated quality</text><text class="d" x="24" y="130">CI on every push, linters, typed</text><text class="d" x="24" y="150">code and tests before release.</text></g></g><g transform="translate(815.8 .5)"><g class="in" style="animation-delay:0.55s"><rect width="384" height="169" rx="14" fill="#fbf9f4" stroke="#e4dccb"/><text class="n" x="24" y="58">03</text><path d="M24 74 H64" stroke="#9c7426" stroke-width="1.5"/><text class="h" x="24" y="104">Built for people</text><text class="d" x="24" y="130">Clear UX, accessible, translated,</text><text class="d" x="24" y="150">and documented end to end.</text></g></g></svg>
