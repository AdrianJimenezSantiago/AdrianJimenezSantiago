name: Refresh profile

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render SVGs
        env:
          # Optional: add a fine-grained PAT as METRICS_TOKEN to include private activity.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
        run: python3 scripts/generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile metrics"
          git push
